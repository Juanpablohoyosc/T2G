name: Fetch course data from OpenStreetMap

on:
  workflow_dispatch:
    inputs:
      refresh_osm:
        description: Refresh holes and greens from OpenStreetMap (slow). Scorecards are always refreshed.
        type: boolean
        default: true
      dry_run:
        description: Only print what would change; don't commit
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Holes and greens from OpenStreetMap
        if: ${{ inputs.refresh_osm }}
        run: node tools/fetch-courses.mjs
      - name: Scorecards from OpenGolfAPI
        run: node tools/add-scorecards.mjs
      - name: Commit the course files
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add data/courses
          git diff --cached --quiet || { git commit -m "Update course data from OpenStreetMap and OpenGolfAPI"; git push; }
